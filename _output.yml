bookdown::gitbook:
  css: style.css
  highlight: tango
  split_by: chapter
  config:
    toc:
      collapse: subsection
      before: |
        <li><a href="./">Solucionario Simulación EPN</a></li>
      after: |
        <li><a href="https://github.com/davidfiergan-hub/solucionario-simulacion-bookdown" target="blank">Publicado en GitHub</a></li>
    toolbar:
      position: fixed
    edit: null
    download: null
    search: yes
    fontsettings:
      theme: white
      family: sans
      size: 2
    sharing:
      facebook: false
      twitter: false
      github: true